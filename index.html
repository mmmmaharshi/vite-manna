<!doctype html>
<html lang="te" class="bg-background text-foreground">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/icon-192.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="మన్నా - తెలుగు బైబిల్ ఆఫ్‌లైన్ రీడర్. Manna is an offline Telugu Bible reader application." />
        <meta name="theme-color" content="#ffffff" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta property="og:title" content="మన్నా - తెలుగు బైబిల్" />
        <meta property="og:description" content="Offline Telugu Bible reader" />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary" />
        <link rel="canonical" href="https://holymanna.maharshi.work" />
        <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Manna - Telugu Bible",
            "description": "Offline Telugu Bible reader",
            "applicationCategory": "Religion",
            "operatingSystem": "Web",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          }
        </script>
        <title>మన్నా - తెలుగు బైబిల్</title>
        <style>
            :root{--background:oklch(97.02% 0.002 262.87);--foreground:oklch(21.03% 0.002 262.87);--muted:oklch(42% 0.005 262.87)}/* Paint the canvas and declare the scheme here: the app stylesheet is a render-blocking link, so until it lands the browser would otherwise paint its own default, which is black in dark mode. */html{background:var(--background,#fff);color-scheme:light}.html-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--background,#fff);color:var(--foreground,#000);font-family:"Google Sans Variable",ui-sans-serif,system-ui,sans-serif}.html-splash-inner{display:flex;flex-direction:column;align-items:center;width:100%;max-width:28rem;padding:0 1.5rem}.html-splash-inner svg{display:block}.html-splash-inner h1{font-size:2.25rem;line-height:2.5rem;font-weight:900;margin:0;color:var(--foreground,#000)}.html-splash-message{margin:.75rem 0 0;min-height:1.25rem;text-align:center;font-size:.875rem;line-height:1.25rem;color:var(--muted,#6b7280)}.html-splash-track{margin-top:1rem;width:160px;height:4px;border-radius:2px;background:color-mix(in oklab,var(--foreground,#000) 14%,transparent);overflow:hidden}.html-splash-bar{width:56px;height:100%;border-radius:2px;background:var(--foreground,#000)}@keyframes splash-move{from{transform:translateX(-56px)}to{transform:translateX(160px)}}@media(prefers-reduced-motion:no-preference){.html-splash-bar{animation:splash-move 1150ms ease-in-out infinite}}
        </style>
        <style>.skip-link{position:absolute;top:-100%;left:8px;z-index:10000;padding:8px 16px;background:var(--foreground,#000);color:var(--background,#fff);border-radius:0 0 8px 8px;font-size:14px;font-weight:600;text-decoration:none;transition:top .15s}.skip-link:focus{top:0;outline:2px solid var(--foreground,#000)}</style>
    </head>
    <body>
        <a href="#main-content" class="skip-link">Skip to content</a>
        <!-- Outside #root on purpose: React clears #root on its first commit, which
             restarts the bar animation. useAppShell removes this element as soon as
             the app has something newer to show, so the splash runs once.
             Mirrors SplashFrame + SplashProgress + SplashView (shared/ui) so the
             hand-off is invisible; keep the two in step. -->
        <div id="boot-splash" class="html-splash">
            <div class="html-splash-inner">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="120" height="120" aria-hidden="true">
                    <path d="M32 53.5C26 49 19.5 47.5 12.5 48.5V24c7-1 13.5.5 19.5 4.5 6-4 12.5-5.5 19.5-4.5v24.5c-7-1-13.5.5-19.5 5Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M32 28.5v25" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <path d="M32 10c2.1 2.9 3.4 4.7 3.4 6.4a3.4 3.4 0 1 1-6.8 0c0-1.7 1.3-3.5 3.4-6.4Z" fill="currentColor"/>
                </svg>
                <h1>Manna</h1>
                <div class="html-splash-track"><div class="html-splash-bar"></div></div>
                <p class="html-splash-message">Preparing Manna...</p>
            </div>
        </div>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
